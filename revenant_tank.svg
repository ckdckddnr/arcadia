<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 76 110" width="76" height="110"
     shape-rendering="crispEdges" role="img" aria-label="Revenant Tank">
  <!-- Matched to the painted sprites as closely as flat shapes allow: the same
       top-down pose and chunky blocking, with a lit top edge and a shadowed
       bottom so it does not read as a flat slab beside them. Corroded machine-green
       instead of camo green, and a dish array where the others carry a barrel. -->

  <!-- treads -->
  <g>
    <rect x="1"  y="24" width="18" height="80" fill="#141812"/>
    <rect x="57" y="24" width="18" height="80" fill="#141812"/>
    <rect x="3"  y="26" width="14" height="76" fill="#2A322A"/>
    <rect x="59" y="26" width="14" height="76" fill="#2A322A"/>
    <!-- lit left edge, shadowed right, same direction on both tracks -->
    <rect x="3"  y="26" width="3" height="76" fill="#414B3E"/>
    <rect x="59" y="26" width="3" height="76" fill="#414B3E"/>
    <rect x="14" y="26" width="3" height="76" fill="#191F19"/>
    <rect x="70" y="26" width="3" height="76" fill="#191F19"/>
    <g fill="#525E4C">
      <rect x="3" y="29"  width="14" height="3"/><rect x="3" y="39"  width="14" height="3"/>
      <rect x="3" y="49"  width="14" height="3"/><rect x="3" y="59"  width="14" height="3"/>
      <rect x="3" y="69"  width="14" height="3"/><rect x="3" y="79"  width="14" height="3"/>
      <rect x="3" y="89"  width="14" height="3"/><rect x="3" y="97"  width="14" height="3"/>
      <rect x="59" y="29" width="14" height="3"/><rect x="59" y="39" width="14" height="3"/>
      <rect x="59" y="49" width="14" height="3"/><rect x="59" y="59" width="14" height="3"/>
      <rect x="59" y="69" width="14" height="3"/><rect x="59" y="79" width="14" height="3"/>
      <rect x="59" y="89" width="14" height="3"/><rect x="59" y="97" width="14" height="3"/>
    </g>
  </g>

  <!-- hull -->
  <rect x="15" y="28" width="46" height="72" fill="#141812"/>
  <rect x="17" y="30" width="42" height="68" fill="#4A5647"/>
  <rect x="17" y="30" width="42" height="5"  fill="#77886E"/>   <!-- top light -->
  <rect x="17" y="30" width="4"  height="68" fill="#65755C"/>   <!-- left light -->
  <rect x="55" y="30" width="4"  height="68" fill="#333D31"/>   <!-- right shade -->
  <rect x="17" y="92" width="42" height="6"  fill="#2B342A"/>   <!-- bottom shade -->

  <!-- deck plating -->
  <rect x="23" y="37" width="9" height="11" fill="#3C4739"/>
  <rect x="44" y="37" width="9" height="11" fill="#3C4739"/>
  <rect x="23" y="37" width="9" height="2"  fill="#6E7E66"/>
  <rect x="44" y="37" width="9" height="2"  fill="#6E7E66"/>
  <!-- rivets -->
  <g fill="#94A886">
    <rect x="20" y="33" width="2" height="2"/><rect x="54" y="33" width="2" height="2"/>
    <rect x="20" y="94" width="2" height="2"/><rect x="54" y="94" width="2" height="2"/>
  </g>

  <!-- turret -->
  <rect x="22" y="50" width="32" height="30" fill="#141812"/>
  <rect x="24" y="52" width="28" height="26" fill="#55634F"/>
  <rect x="24" y="52" width="28" height="4"  fill="#8A9C80"/>
  <rect x="24" y="52" width="4"  height="26" fill="#72836A"/>
  <rect x="48" y="52" width="4"  height="26" fill="#3F4A3B"/>
  <rect x="24" y="74" width="28" height="4"  fill="#353F32"/>

  <!-- emblem: broadcast rings -->
  <g fill="none" stroke="#7CFF4F" stroke-width="2">
    <path d="M30 68 a9 9 0 0 1 16 0"/>
    <path d="M33 73 a5 5 0 0 1 10 0"/>
  </g>
  <rect x="36" y="76" width="4" height="3" fill="#C8FFA8"/>

  <!-- dish array -->
  <rect x="34" y="16" width="8" height="36" fill="#141812"/>
  <rect x="35" y="17" width="6" height="35" fill="#4A5647"/>
  <rect x="35" y="17" width="2" height="35" fill="#77886E"/>
  <rect x="24" y="8"  width="28" height="10" fill="#141812"/>
  <rect x="25" y="9"  width="26" height="8"  fill="#77886E"/>
  <rect x="25" y="9"  width="26" height="2"  fill="#A6BA97"/>
  <rect x="25" y="15" width="26" height="2"  fill="#454F3E"/>
  <!-- emitters -->
  <rect x="28" y="2" width="4" height="8" fill="#7CFF4F"/>
  <rect x="36" y="0" width="4" height="10" fill="#C8FFA8"/>
  <rect x="44" y="2" width="4" height="8" fill="#7CFF4F"/>
</svg>
