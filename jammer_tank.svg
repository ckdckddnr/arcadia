<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 76 110" width="76" height="110"
     shape-rendering="crispEdges" role="img" aria-label="Jammer Tank">
  <!-- Matched to the painted sprites as closely as flat shapes allow: the same
       top-down pose and chunky blocking, with a lit top edge and a shadowed
       bottom so it does not read as a flat slab beside them. Steel and cyan
       instead of camo green, and a dish array where the others carry a barrel. -->

  <!-- treads -->
  <g>
    <rect x="1"  y="24" width="18" height="80" fill="#161B22"/>
    <rect x="57" y="24" width="18" height="80" fill="#161B22"/>
    <rect x="3"  y="26" width="14" height="76" fill="#2C3542"/>
    <rect x="59" y="26" width="14" height="76" fill="#2C3542"/>
    <!-- lit left edge, shadowed right, same direction on both tracks -->
    <rect x="3"  y="26" width="3" height="76" fill="#47535F"/>
    <rect x="59" y="26" width="3" height="76" fill="#47535F"/>
    <rect x="14" y="26" width="3" height="76" fill="#1B222B"/>
    <rect x="70" y="26" width="3" height="76" fill="#1B222B"/>
    <g fill="#5A6875">
      <rect x="3" y="29"  width="14" height="3"/><rect x="3" y="39"  width="14" height="3"/>
      <rect x="3" y="49"  width="14" height="3"/><rect x="3" y="59"  width="14" height="3"/>
      <rect x="3" y="69"  width="14" height="3"/><rect x="3" y="79"  width="14" height="3"/>
      <rect x="3" y="89"  width="14" height="3"/><rect x="3" y="97"  width="14" height="3"/>
      <rect x="59" y="29" width="14" height="3"/><rect x="59" y="39" width="14" height="3"/>
      <rect x="59" y="49" width="14" height="3"/><rect x="59" y="59" width="14" height="3"/>
      <rect x="59" y="69" width="14" height="3"/><rect x="59" y="79" width="14" height="3"/>
      <rect x="59" y="89" width="14" height="3"/><rect x="59" y="97" width="14" height="3"/>
    </g>
  </g>

  <!-- hull -->
  <rect x="15" y="28" width="46" height="72" fill="#161B22"/>
  <rect x="17" y="30" width="42" height="68" fill="#5A6B80"/>
  <rect x="17" y="30" width="42" height="5"  fill="#8496AB"/>   <!-- top light -->
  <rect x="17" y="30" width="4"  height="68" fill="#71839A"/>   <!-- left light -->
  <rect x="55" y="30" width="4"  height="68" fill="#3B4757"/>   <!-- right shade -->
  <rect x="17" y="92" width="42" height="6"  fill="#333E4C"/>   <!-- bottom shade -->

  <!-- deck plating -->
  <rect x="23" y="37" width="9" height="11" fill="#43505F"/>
  <rect x="44" y="37" width="9" height="11" fill="#43505F"/>
  <rect x="23" y="37" width="9" height="2"  fill="#7C8DA2"/>
  <rect x="44" y="37" width="9" height="2"  fill="#7C8DA2"/>
  <!-- rivets -->
  <g fill="#96A6B9">
    <rect x="20" y="33" width="2" height="2"/><rect x="54" y="33" width="2" height="2"/>
    <rect x="20" y="94" width="2" height="2"/><rect x="54" y="94" width="2" height="2"/>
  </g>

  <!-- turret -->
  <rect x="22" y="50" width="32" height="30" fill="#161B22"/>
  <rect x="24" y="52" width="28" height="26" fill="#6A7C92"/>
  <rect x="24" y="52" width="28" height="4"  fill="#99AABF"/>
  <rect x="24" y="52" width="4"  height="26" fill="#8093A9"/>
  <rect x="48" y="52" width="4"  height="26" fill="#48566A"/>
  <rect x="24" y="74" width="28" height="4"  fill="#3E4A5B"/>

  <!-- emblem: broadcast rings -->
  <g fill="none" stroke="#2DE1FC" stroke-width="2">
    <path d="M30 68 a9 9 0 0 1 16 0"/>
    <path d="M33 73 a5 5 0 0 1 10 0"/>
  </g>
  <rect x="36" y="76" width="4" height="3" fill="#8FE9FB"/>

  <!-- dish array -->
  <rect x="34" y="16" width="8" height="36" fill="#161B22"/>
  <rect x="35" y="17" width="6" height="35" fill="#5A6B80"/>
  <rect x="35" y="17" width="2" height="35" fill="#8496AB"/>
  <rect x="24" y="8"  width="28" height="10" fill="#161B22"/>
  <rect x="25" y="9"  width="26" height="8"  fill="#8496AB"/>
  <rect x="25" y="9"  width="26" height="2"  fill="#B3C2D4"/>
  <rect x="25" y="15" width="26" height="2"  fill="#4E5B6C"/>
  <!-- emitters -->
  <rect x="28" y="2" width="4" height="8" fill="#2DE1FC"/>
  <rect x="36" y="0" width="4" height="10" fill="#8FE9FB"/>
  <rect x="44" y="2" width="4" height="8" fill="#2DE1FC"/>
</svg>
